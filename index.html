<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="Dizajn.css" rel="stylesheet">
</head>
<body>

    <div class="header-blue">
        <div class="container">
            <h1 class="fw-bold px-3">Booking.com</h1>
        </div>
    </div>

    <div class="container">
        <form id="searchForm" onsubmit="event.preventDefault(); Provera();">
        <div class="search-container shadow-sm mb-3 mx-3">
            <div class="row g-1">
                <div class="col-md-3">
                    <div class="search-input-group">
                        <input id="Destinacija" type="text" placeholder="Enter your destination" required>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <div class="search-input-group">
                        <input id="datum" type="text" placeholder="Check-in - Check-out" required>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <div class="search-input-group">
                        <input id="covek" type="text" placeholder="1 Adult - 0 Children" required>
                    </div>
                </div>
                
                <div class="col-md-1 d-flex align-items-center justify-content-center bg-white border">
                    <input type="checkbox" id="petFriendly" class="me-1"> 
                    <small class="text-muted">Pet Friendly?</small>
                </div>
                
                <div class="col-md-2">
                    <button type="submit" class="btn-reserve w-100 h-100 fw-bold border-0">Search</button>
                </div>
            </div>
        </div>
    </form>

        <div id="glavni-sadrzaj" style="margin-top: -20px;">
            <div class="row px-3 g-4">
                
                <div class="col-lg-6">
                    <div class="hotel-card shadow-sm d-flex flex-column flex-sm-row h-100 border rounded overflow-hidden bg-white">
                        <img id="img-1" src="Kaludjerica.avif" class="hotel-img" style="width: 35%; aspect-ratio: 4 / 3;object-fit: cover;">
                        <div class="p-3 w-100 d-flex flex-column justify-content-between">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 id="ime-1" class="fw-bold mb-0">Kaludjerica</h6>
                                    <div id="stars-1" class="stars">☆☆</div>
                                </div>
                                <div class="text-end"><span id="cena-1" class="price-text">RSD 4,500</span></div>
                            </div>
                            <button onclick="prikaziPlacanje()" class="btn-reserve mt-3">Reserve</button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="hotel-card shadow-sm d-flex flex-column flex-sm-row h-100 border rounded overflow-hidden bg-white">
                        <img id="img-2" src="Lestane.jpg" class="hotel-img" style="width: 35%; aspect-ratio: 4 / 3;object-fit: cover;">
                        <div class="p-3 w-100 d-flex flex-column justify-content-between">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 id="ime-2" class="fw-bold mb-0">Lestane</h6>
                                    <div id="stars-2" class="stars">☆☆☆☆☆</div>
                                </div>
                                <div class="text-end"><span id="cena-2" class="price-text">RSD 2,100</span></div>
                            </div>
                            <button onclick="prikaziPlacanje()" class="btn-reserve mt-3">Reserve</button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="hotel-card shadow-sm d-flex flex-column flex-sm-row h-100 border rounded overflow-hidden bg-white">
                        <img src="AbuDabi.jpg" id="img-3" class="hotel-img" style="width: 35%; aspect-ratio: 4 / 3; object-fit: cover;">
                        <div class="p-3 w-100 d-flex flex-column justify-content-between">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 id="ime-3" class="fw-bold mb-0">Stepa Stepanovic</h6>
                                    <div id="stars-3" class="stars">☆☆☆☆☆</div>
                                </div>
                                <div class="text-end"><span id="cena-3" class="price-text">RSD 12,420</span></div>
                            </div>
                            <button onclick="prikaziPlacanje()" class="btn-reserve mt-3">Reserve</button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="hotel-card shadow-sm d-flex flex-column flex-sm-row h-100 border rounded overflow-hidden bg-white">
                        <img id="img-4" src="Paris.jpg" class="hotel-img" style="width: 35%; aspect-ratio: 4 / 3; object-fit: cover;">
                        <div class="p-3 w-100 d-flex flex-column justify-content-between">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 id="ime-4" class="fw-bold mb-0">Pariz</h6>
                                    <div id="stars-4" class="stars">☆☆☆☆</div>
                                </div>
                                <div class="text-end"><span id="cena-4" class="price-text">RSD 10,400</span></div>
                            </div>
                            <button onclick="prikaziPlacanje()" class="btn-reserve mt-3">Reserve</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script >
    
function Provera() {
    let polje = document.getElementById('Destinacija');
    let unos = polje.value.trim().toLowerCase();
   
    
    if (unos == "zlatibor") {
       
        document.getElementById("ime-1").innerText = "Titova Vila";
        document.getElementById("img-1").src = "Zlatibor.jpg";
        document.getElementById("img-1").alt = "Titova Vila";
        document.getElementById("stars-1").innerHTML = "☆☆☆☆";
        document.getElementById("cena-1").innerText = "RSD 9,000";

        document.getElementById("ime-2").innerText = "Zlatibor Klub";
        document.getElementById("img-2").src = "Apartman_1.jpg";
        document.getElementById("img-2").alt = "Zlatibor Klub";
        document.getElementById("stars-2").innerHTML = "☆☆";
        document.getElementById("cena-2").innerText = "RSD 4,370";

        document.getElementById("ime-3").innerText = "Apartman Zlatibor";
         document.getElementById("img-3").src = "Apartman_2.jpg";
        document.getElementById("img-3").alt = "Apartman Zlatibor";
        document.getElementById("stars-3").innerHTML = "☆☆☆";
        document.getElementById("cena-3").innerText = "RSD 7,630";

        document.getElementById("ime-4").innerText = "Mona Plaza";
         document.getElementById("img-3").src = "MonaPlaza.jpg";
        document.getElementById("img-4").alt = "Mona Plaza ";
        document.getElementById("stars-4").innerHTML = "☆☆☆☆";
        document.getElementById("cena-4").innerText = "RSD 14,810";
    }
     else {
        alert("Molimo unesite drugu destinaciju (npr. Zlatibor)");
        return;
    }

}
function prikaziPlacanje() {

     let polje = document.getElementById('ime-1').innerText;

    if(polje=="Titova Vila"){

    let kontejner = document.getElementById("glavni-sadrzaj");

      kontejner.innerHTML = `
<div class="container mt-5">

    <form id="paymentForm" onsubmit="event.preventDefault(); payNow();">

        <div class="row align-items-stretch equal-height">

           
            <div class="col-lg-5 mb-3">
                <div class="hotel-card shadow-sm border rounded bg-white h-100">
                    
                    <img src="Zlatibor.jpg"
                         class="img-fluid w-100"
                         style="height:220px; object-fit:cover;">

                    <div class="p-3 text-center">
                        <h5 class="fw-bold mb-0">Titova Vila</h5>
                        <div style="font-size:20px;" class = "stars">☆☆☆☆☆</div>
                        <span id="cena-4" class="price-text">RSD 10,400</span>
                    </div>

                </div>
            </div>

     
            <div class="col-lg-4 mb-3">

                <div class="carousel-container">
       
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
            
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
				<button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3"></button>
				<button type="button" data-bs-target="#carouselExample" data-bs-slide-to="4"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="5"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="6"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="7"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="8"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="9"></button>
            </div>

            <div class="carousel-inner shadow-lg">
                <div class="carousel-item active">
                    <img src="Slika1.png" class="d-block" alt="Slika 1">
                    <div class="carousel-caption d-none d-md-block">
					<h5>Light Moon</h5>
                        
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="Slika2.png" class="d-block" alt="Slika 2">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Macchiato</h5>
                        
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="Slika3.png" class="d-block" alt="Slika 3">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Cinnamon</h5>
                        
                    </div>
                </div>
				<div class="carousel-item">
                    <img src="Slika5.png" class="d-block" alt="Slika 4">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Black Rose</h5>
                        
                    </div>
                </div>
				<div class="carousel-item">
                    <img src="Slika4.png" class="d-block" alt="Slika 5">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Moody Green</h5>
                        
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="Slika6.png" class="d-block" alt="Slika 6">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Baby Blue</h5>
                        
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="Slika7.png" class="d-block" alt="Slika 7">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Quartz</h5>
                        
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="Slika8.png" class="d-block" alt="Slika 8">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Salmon</h5>
                        
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="Slika9.png" class="d-block" alt="Slika 9">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Origami</h5>
                        
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="Slika10.png" class="d-block" alt="Slika 10">
                    <div class="carousel-caption d-none d-md-block">
                       <h5>Olive</h5>
                        
                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Prethodna</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Sledeća</span>
            </button>
        </div>
    </div>

            </div>

           
            <div class="col-lg-3 mb-3">

                <div id="StatusTeksta"
                     class="payment-card shadow-sm p-3 border rounded bg-white h-100">

                    <label class="form-label fw-bold small">
                        Enter your card details:
                    </label>

                    <input type="text"
                           id="cardNum"
                           class="form-control mb-2"
                           placeholder="Card number"
                           required>

                    <div class="row g-2 mb-2">
                        <div class="col-8">
                            <input type="text"
                                   class="form-control"
                                   placeholder="MM/YY">
                        </div>
                        <div class="col-4">
                            <input type="text"
                                   class="form-control"
                                   placeholder="CVV">
                        </div>
                    </div>

                    <input type="email"
                           id="userEmail"
                           class="form-control mb-3"
                           placeholder="Email"
                           required>
                            <label class="form-label fw-bold small">
                        Choose color of your room:
                    </label>
                           <select id="offerSelect" class="form-control mb-3">
    <option value="Light Moon">Light Moon</option>
    <option value="Macchiato">Macchiato</option>
    <option value="Cinnamon">Cinnamon</option>
    <option value="Black Rose">Black Rose</option>
    <option value="Moody Green">Moody Green</option>
    <option value="Baby Blue">Baby Blue</option>
    <option value="Quartz">Quartz</option>
    <option value="Salmon">Salmon</option>
    <option value="Origami">Origami</option>
    <option value="Olive">Olive</option>
</select>

                    <button type="submit"
                            class="btn-reserve w-100">
                        Pay Now
                    </button>
                        
                </div>

            </div>

        </div>

    </form>

</div>
`;


    window.scrollTo({ top: 0, behavior: 'smooth' });

    }

}

        function payNow() {
    let status = document.getElementById("StatusTeksta");
    let email = document.getElementById("userEmail").value;
    let datum0 = document.getElementById("datum");
    let datum2 = datum0.value
    let datum1 = datum2?datum2:"22/04/2026 - 23/04/2026";
    let broj = document.getElementById("covek");
    let broj2 = broj.value;
    let broj1 = broj2?broj2:"1 adult";
    let izbor = document.getElementById("offerSelect").value;
            
            status.style.minHeight = "360px";
    status.className = "payment-card shadow-sm p-4 h-100 border rounded bg-white d-flex flex-column align-items-center justify-content-center text-center";
            
   status.innerHTML = `

    <h4 class="fw-bold">Thank you for your purchase!</h4>
    <h4 class="fw-bold">
        You have purchased this reservation for ${datum1} for ${broj1}.
    </h4>
    <h4 class="fw-bold">
        Notification of your purchase will be sent to ${email} email address.
    </h4>

</div>
`;

} 

    </script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
